<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surpresa Especial, Isabelly! 🎁</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #confetti-container, #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            max-width: 420px;
            border-radius: 28px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            position: relative;
            transform: translateY(30px);
            opacity: 0;
            animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Bolo Dinâmico Estilizado */
        .cake-container {
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 12px;
            perspective: 600px;
        }

        #cake {
            display: block;
            position: relative;
            width: 130px;
            height: 65px;
            background: linear-gradient(135deg, #78350f, #92400e);
            border-radius: 12px 12px 0 0;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.4);
            animation: dropCake 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(-60px) scale(0.8);
        }

        @keyframes dropCake {
            0% { opacity: 0; transform: translateY(-70px) scale(0.8); }
            60% { opacity: 1; transform: translateY(10px) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        #cake::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 22px;
            background: #ffffff;
            border-radius: 12px 12px 6px 6px;
            transform: scaleX(0);
            transform-origin: center;
            animation: spreadGlaze 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.7s forwards;
        }

        @keyframes spreadGlaze {
            to { transform: scaleX(1); }
        }

        #cake::after {
            content: "";
            position: absolute;
            top: 17px;
            left: 6px;
            right: 6px;
            height: 14px;
            background: radial-gradient(circle, #ffffff 65%, transparent 35%);
            background-size: 14px 14px;
            opacity: 0;
            animation: fadeInGlaze 0.3s ease-out 1.1s forwards;
        }

        @keyframes fadeInGlaze {
            to { opacity: 1; }
        }

        .candle {
            background: linear-gradient(to right, #e2e8f0, #ffffff, #cbd5e1);
            border-radius: 4px;
            position: absolute;
            top: -32px;
            left: 50%;
            margin-left: -2.5px;
            width: 5px;
            height: 0px;
            animation: growCandle 0.5s ease-out 1.2s forwards;
        }

        @keyframes growCandle {
            to { height: 32px; }
        }

        .fire {
            border-radius: 50%;
            position: absolute;
            top: -16px;
            left: 50%;
            margin-left: -3px;
            width: 6px;
            height: 16px;
            background: linear-gradient(to top, #f59e0b, #fbbf24, #ffffff);
            transform: scale(0);
            animation: popFire 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.7s forwards, flicker 0.8s infinite alternate 2.1s;
            box-shadow: 0 0 12px #f59e0b, 0 0 24px #ef4444;
        }

        @keyframes popFire {
            to { transform: scale(1); }
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.18) rotate(2deg); opacity: 1; filter: brightness(1.3); }
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .name-highlight {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 12px;
            display: block;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* Raspadinha */
        .scratch-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            margin-bottom: 24px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(236, 72, 153, 0.3);
            background: #111827;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .scratch-value {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 2.8rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            z-index: 1;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }
        
        .scratch-value span { 
            font-size: 0.85rem; 
            font-weight: 700; 
            letter-spacing: 2px; 
            color: #94a3b8; 
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        canvas#scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
        }

        #pix-form {
            display: none;
            animation: formReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-align: left;
        }

        @keyframes formReveal {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background-color: rgba(31, 41, 55, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 18px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background-color: rgba(31, 41, 55, 1);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        button.btn-resgatar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.4);
        }

        button.btn-resgatar:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(236, 72, 153, 0.6);
            filter: brightness(1.1);
        }

        /* ANIMAÇÃO DE LANÇAMENTO DA CAIXINHA E DINHEIRO (ESTILO REELS) */
        #loading-animation {
            display: none;
            text-align: center;
            padding: 15px 0;
            animation: slideInFromTop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideInFromTop {
            0% { opacity: 0; transform: translateY(-30px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .launch-scene {
            position: relative;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .flying-money {
            position: absolute;
            font-size: 1.6rem;
            animation: launchMoney 1s infinite linear;
            opacity: 0;
        }

        .flying-money:nth-child(1) { animation-delay: 0s; }
        .flying-money:nth-child(2) { animation-delay: 0.3s; }
        .flying-money:nth-child(3) { animation-delay: 0.6s; }

        @keyframes launchMoney {
            0% { transform: translateY(-40px) translateX(-40px) scale(0.4) rotate(-20deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(10px) translateX(0px) scale(1.3) rotate(0deg); opacity: 0; }
        }

        .target-box {
            font-size: 3rem;
            animation: boxPulse 0.8s infinite alternate ease-in-out;
        }

        @keyframes boxPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .launch-text {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 700;
            margin-top: 5px;
        }

        /* Mensagem de Sucesso Final (Lançada na tela) */
        #success-message {
            display: none;
            animation: slideInFromTop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            color: var(--accent);
            background: rgba(6, 182, 212, 0.08);
            padding: 24px 20px;
            border-radius: 16px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            text-align: center;
        }

        #success-message h2 { font-size: 1.35rem; margin-bottom: 8px; color: #fff; }
        #success-message p { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; }
        #success-message strong { color: var(--accent); }
    </style>
</head>
<body>

    <div id="particles-container"></div>
    <div id="confetti-container"></div>

    <div class="card">
        <!-- Bolo com Montagem Animada -->
        <div class="cake-container">
            <div id="cake">
                <div class="candle">
                    <div class="fire"></div>
                </div>
            </div>
        </div>

        <h1>Feliz Aniversário!</h1>
        <span class="name-highlight">Isabelly</span>
        <p class="subtitle">O departamento preparou uma surpresa exclusiva para você. Raspe abaixo para revelar!</p>

        <div class="scratch-wrapper">
            <div class="scratch-value">
                <span>Seu Presente</span>
                R$ 100
            </div>
            <canvas id="scratch-canvas"></canvas>
        </div>

        <!-- Formulário Web3Forms -->
        <form id="pix-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="9a817b54-074f-471b-bfb4-a797baccfb74">
            <input type="hidden" name="subject" value="🎉 RESGATE PIX: Aniversário Isabelly">
            <input type="hidden" name="aniversariante" value="Isabelly">
            <input type="hidden" name="valor_presente" value="R$ 100,00">
            
            <label for="pix_key">Onde a gente deposita o bolo? Digite sua Chave Pix:</label>
            <input type="text" id="pix_key" name="chave_pix" placeholder="CPF, E-mail, Telefone ou Aleatória" required>
            
            <button type="submit" class="btn-resgatar">Resgatar Presente 🎁</button>
        </form>

        <!-- Animação do Lançamento da Caixa e Notas de Dinheiro -->
        <div id="loading-animation">
            <div class="launch-scene">
                <span class="flying-money">💵</span>
                <span class="flying-money">💵</span>
                <span class="flying-money">💵</span>
                <div class="target-box">📦</div>
            </div>
            <div class="launch-text">adicionando R$ 100 na caixinha...</div>
        </div>

        <!-- Sucesso Final -->
        <div id="success-message">
            <h2>✨ Prontinho, Isabelly!</h2>
            <p>Os R$ 100 foram enviados com sucesso.<br>Você receberá o Pix na sua conta <strong>em até 5 minutos!</strong> ⚡</p>
        </div>
    </div>

    <script>
        // Partículas de fundo
        function initParticles() {
            const container = document.getElementById('particles-container');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.width = Math.random() * 3 + 1 + 'px';
                p.style.height = p.style.width;
                p.style.backgroundColor = Math.random() > 0.5 ? '#ec4899' : '#8b5cf6';
                p.style.borderRadius = '50%';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = Math.random() * 100 + 'vh';
                p.style.opacity = Math.random() * 0.5 + 0.2;
                
                const duration = Math.random() * 6 + 4;
                const delay = Math.random() * 5;
                p.style.animation = `floatParticle ${duration}s ease-in-out ${delay}s infinite alternate`;
                container.appendChild(p);
            }
        }

        const particleStyle = document.createElement('style');
        particleStyle.innerHTML = `
            @keyframes floatParticle {
                0% { transform: translateY(0) translateX(0); }
                100% { transform: translateY(-40px) translateX(20px); }
            }
        `;
        document.head.appendChild(particleStyle);
        initParticles();

        // Raspadinha Canvas
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let isRevealed = false;

        function initCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#334155');
            gradient.addColorStop(0.5, '#475569');
            gradient.addColorStop(1, '#1e293b');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '700 13px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✨ ARRASTE O DEDO PARA RASPAR ✨', canvas.width / 2, canvas.height / 2);
        }

        function getBrushPos(xRef, yRef) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: xRef - rect.left,
                y: yRef - rect.top
            };
        }

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 24, 0, Math.PI * 2, false);
            ctx.fill();
            checkScratchPercentage();
        }

        function checkScratchPercentage() {
            if (isRevealed) return;

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;

            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparentPixels++;
            }

            const percentage = (transparentPixels / (pixels.length / 4)) * 100;

            if (percentage > 38) {
                isRevealed = true;
                canvas.style.transition = 'opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.display = 'none';
                    const form = document.getElementById('pix-form');
                    form.style.display = 'block';
                    document.getElementById('pix_key').focus();
                    createConfetti(50);
                }, 700);
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; const pos = getBrushPos(e.clientX, e.clientY); scratch(pos.x, pos.y); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) { const pos = getBrushPos(e.clientX, e.clientY); scratch(pos.x, pos.y); } });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; const pos = getBrushPos(e.touches[0].clientX, e.touches[0].clientY); scratch(pos.x, pos.y); });
        canvas.addEventListener('touchmove', (e) => { if (isDrawing) { const pos = getBrushPos(e.touches[0].clientX, e.touches[0].clientY); scratch(pos.x, pos.y); } });
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        window.addEventListener('load', initCanvas);

        // Envio com a Animação de Lançamento
        const form = document.getElementById('pix-form');
        const loadingAnimation = document.getElementById('loading-animation');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(form);

            // Esconde o formulário e lança a animação
            form.style.display = 'none';
            loadingAnimation.style.display = 'block';

            setTimeout(() => {
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                }).then(response => {
                    loadingAnimation.style.display = 'none';
                    if (response.ok) {
                        successMessage.style.display = 'block';
                        createConfetti(70);
                    } else {
                        alert("Ocorreu um problema ao registrar. Tente novamente!");
                        form.style.display = 'block';
                    }
                }).catch(() => {
                    loadingAnimation.style.display = 'none';
                    alert("Erro de conexão ao enviar o formulário.");
                    form.style.display = 'block';
                });
            }, 2200);
        });

        // Confetes
        function createConfetti(count) {
            const container = document.getElementById('confetti-container');
            const colors = ['#8b5cf6', '#ec4899', '#06b6d4', '#fbbf24', '#ffffff'];

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = Math.random() * 8 + 4 + 'px';
                confetti.style.height = Math.random() * 8 + 4 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.opacity = Math.random() * 0.8 + 0.2;
                confetti.style.pointerEvents = 'none';

                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                confetti.style.animation = `fall ${duration}s linear ${delay}s infinite`;

                container.appendChild(confetti);
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fall {
                0% { transform: translateY(0) rotate(0deg); }
                100% { transform: translateY(105vh) rotate(720deg); }
            }
        `;
        document.head.appendChild(style);
        createConfetti(25);
    </script>
</body>
</html>
